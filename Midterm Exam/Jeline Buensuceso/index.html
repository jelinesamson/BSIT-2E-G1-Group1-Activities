<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Task Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center text-danger mb-4">Student Task Manager</h1>

      <div class="d-flex justify-content-center mb-3">
        <div class="card p-4 shadow w-50">
          <form id="taskForm" class="text-center">
            <div class="mb-3">
              <input
                type="text"
                id="taskTitle"
                class="form-control text-center"
                placeholder="Task Title"
              />
            </div>

            <div class="mb-3">
              <input
                type="text"
                id="taskDescrip"
                class="form-control text-center"
                placeholder="Task Description"
              />
            </div>

            <div class="mb-3">
              <select id="priority" class="form-select text-center">
                <option value="">Select Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>

            <div class="mb-3">
              <input
                type="date"
                id="dueDate"
                class="form-control text-center"
              />
            </div>

            <div class="mb-3">
              <button type="submit" class="btn btn-success w-100">
                Add Task
              </button>
            </div>

            <small id="err" class="text-danger"></small>
          </form>
        </div>
      </div>

      <div class="card shadow">
        <table class="table table-hover text-center">
          <thead class="table-danger">
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Priority</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="taskList"></tbody>
        </table>
      </div>
    </div>

    <script src="func.js"></script>
  </body>
</html>
